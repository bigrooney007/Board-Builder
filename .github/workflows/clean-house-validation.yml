name: Clean House Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate Recruitment clean-house contract
        run: python tests/validate_recruitment_clean_house.py

      - name: Validate Board Fundraising Game clean-house contract
        run: python tests/validate_fundraising_game_clean_house.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Build frontend
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "http://localhost:8000"
        run: yarn --cwd frontend build
