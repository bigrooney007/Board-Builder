name: Board Builder V2 Validation

on:
  push:
    branches: [feature/nbb-simplified-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic test dependencies
        run: python -m pip install fastapi httpx PyJWT bcrypt python-multipart pillow python-docx reportlab python-dotenv email-validator requests beautifulsoup4 uvicorn playwright stripe resend
      - name: Backend journeys and preservation
        run: |
          python -m unittest discover -s backend/tests -p 'test_v2*.py'
          python tests/validate_v2_contracts.py
          python -m compileall -q backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install existing frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile
      - name: V2 React tests
        env:
          CI: "true"
        run: |
          mapper='{"^@/(.*)$":"<rootDir>/src/$1","^react-router-dom$":"<rootDir>/node_modules/react-router-dom/dist/index.js","^react-router$":"<rootDir>/node_modules/react-router/dist/development/index.js","^react-router/dom$":"<rootDir>/node_modules/react-router/dist/development/dom-export.js"}'
          yarn --cwd frontend test --watchAll=false --runInBand --testPathPattern=src/v2 --setupFiles="$GITHUB_WORKSPACE/tests/v2_jest_setup.cjs" --moduleNameMapper="$mapper"
      - name: Production frontend build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ""
        run: |
          yarn --cwd frontend build
          node tests/validate_v2_frontend.cjs
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile synthetic browser journeys
        run: |
          python tests/v2_local_app.py --port 8765 > /tmp/nbb-v2-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8765/test/health
          python tests/v2_browser_harness.py --base http://127.0.0.1:8765 --artifacts /tmp/nbb-v2-browser-results
          python tests/v2_layout_harness.py --artifacts /tmp/nbb-v2-layout-results
      - name: Save browser findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbb-v2-validation
          path: |
            /tmp/nbb-v2-browser-results
            /tmp/nbb-v2-layout-results
            /tmp/nbb-v2-fixture.log
      - name: Read-only public deployment check
        continue-on-error: true
        run: python tests/v2_live_smoke.py
      - name: Save public deployment findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbb-v2-live-public-check
          path: /tmp/nbb-v2-live-results
