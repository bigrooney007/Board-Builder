name: Recovered Offer Validation
on:
  push:
    branches: [fix/preserve-original-ui-editable-offers-20261015]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      RECOVERY_ACCEPTANCE: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      JWT_SECRET: isolated-recovery-acceptance-secret-not-for-production
      REACT_APP_BACKEND_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the existing pinned backend test dependencies
        run: |
          python -c 'from pathlib import Path; names={"fastapi","starlette","pydantic","pydantic_core","httpx","motor","pymongo","bcrypt","PyJWT","uvicorn","email-validator"}; Path("/tmp/recovered-requirements.txt").write_text("\n".join(x for x in Path("backend/requirements.txt").read_text().splitlines() if x.split("==")[0] in names))'
          pip install -r /tmp/recovered-requirements.txt playwright
      - name: Backend compilation and original route regressions
        run: |
          python tests/validate_recovered_offer_scope.py
          python -m compileall -q backend
          python -m unittest discover -s backend/tests -p test_recovered_offer_content.py -v
          python -m unittest discover -s backend/tests -p test_dashboard_walkthrough_videos.py -v
          python -m unittest discover -s backend/tests -p test_agentic_recruitment_contract.py -v
          python -m unittest discover -s backend/tests -p test_guided_prepayment_handoff.py -v
          python -m unittest discover -s backend/tests -p test_four_customer_journeys_contract.py -v
          python -m unittest discover -s backend/tests -p test_recovered_recruitment_routes.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn --cwd frontend install --frozen-lockfile
      - name: Original frontend journey regressions
        env:
          CI: 'true'
        run: |
          mapper='{"^@/(.*)$":"<rootDir>/src/$1","^react-router-dom$":"<rootDir>/node_modules/react-router-dom/dist/index.js","^react-router$":"<rootDir>/node_modules/react-router/dist/development/index.js","^react-router/dom$":"<rootDir>/node_modules/react-router/dist/development/dom-export.js"}'
          yarn --cwd frontend test --watchAll=false --runInBand --testPathPattern='(GuidedUpgrade|PublicStartJourneys|GuidedPrepaymentQuestionsPage|RecruitmentFlow|RecoveredOffers|GamePublicLanding|GameFreeQuestionsPage)\.test' --setupFiles="$GITHUB_WORKSPACE/tests/recovered_jest_setup.cjs" --moduleNameMapper="$mapper"
      - name: Production build
        env:
          CI: 'false'
        run: yarn --cwd frontend build
      - run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile acceptance
        run: |
          uvicorn tests.recovered_offer_app:app --host 127.0.0.1 --port 8765 > /tmp/recovery-server.log 2>&1 &
          python tests/recovered_offer_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-offer-acceptance
          path: |
            test_reports/recovery*
            /tmp/recovery-server.log
